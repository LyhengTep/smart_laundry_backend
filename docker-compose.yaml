version: "3.9"
services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  smart_laundry_backend:
    platform: linux/amd64
    container_name: smart-laundry-backend
    restart: unless-stopped
    image: lyheng/smartlaundry_backend:7db75303a0c2dab2ba434015fd163716cf9f49b9
    env_file:
      - .env
    volumes:
      - ./firebaseServiceAccount.json:/app/msg/firebaseServiceAccount.json
      - uploads_data:/app/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    image: smart-laundry-web:local
    # platform: linux/amd64
    depends_on:
      - smart_laundry_backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
