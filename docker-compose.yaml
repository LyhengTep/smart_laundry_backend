version: "3.9"

services:
  postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - uploads_data:/app/app/uploads
      - ./init:/docker-entrypoint-initdb.d
  smart_laundry_backend:
    build: .
    platform: linux/amd64
    container_name: smart-laundry-backend
    restart: unless-stopped
    image: lyheng/smartlaundry_backend:0.0.1-dev.4
    environment:
      ENV: DEV
      DATABASE_URL: postgresql+asyncpg://smart_laundry:p_JI7F7!|3x>@postgres:5432/smart_laundry
      SECRET_KEY: supersecret

      DB_INIT_STRATEGY: create_all

    ports:
      - "8000:8000"

    depends_on:
      - postgres
  web: 
    image: lyheng/smart-laundry-web:0.0.1-dev.2
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://ec2-13-229-201-188.ap-southeast-1.compute.amazonaws.com:8000/api/v1
    restart: unless-stopped
volumes:
  postgres_data:
  uploads_data: 
