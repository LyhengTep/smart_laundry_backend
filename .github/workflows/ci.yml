name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest app/tests/ -v --tb=short
        env:
          JWT_SECRET: ci-test-secret

      - name: Notify Test Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELE_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELE_CHAT_ID }} \
          -d text="❌ Tests failed on commit ${{ github.sha }} by ${{ github.actor }}. Please fix before merging."

  docker:
    runs-on: ubuntu-latest
    needs: test
    environment: UAT
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t lyheng/smartlaundry_backend:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push lyheng/smartlaundry_backend:${{ github.sha }}

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELE_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELE_CHAT_ID }} \
          -d text="✅ Backend build succeeded for commit ${{ github.sha }} by ${{ github.actor }}. Image: lyheng/smartlaundry_backend:${{ github.sha }}"

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELE_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELE_CHAT_ID }} \
          -d text="❌ Backend build failed for commit ${{ github.sha }} by ${{ github.actor }}. Please check the GitHub Actions logs for details."